name: Verify and Build VK Search v0.4.10 on GitHub-Hosted Mac ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vk-search-v0410-github-hosted-release
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout v0.4.10 public build overlay
        uses: actions/checkout@v4
        with:
          path: overlay
          fetch-depth: 1

      - name: Clone frozen public v0.4.9 baseline
        run: |
          git clone --depth 1 --branch main https://github.com/danilisery754-png/vk-search-macos-build.git source
          grep -q '45d96c6f2931bbeb346e82a1e136ea5c624002ff' source/SOURCE_PROVENANCE.md

      - name: Assemble exact v0.4.10 source candidate
        run: |
          python3 overlay/scripts/assemble_v0410.py source
          test -f source/v047_source/frontend/src/styles/v0410.css
          test -f source/v047_source/frontend/src/pages/InboxPage.tsx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: source/v047_source/backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/v047_source/frontend/package-lock.json

      - name: Verify native Apple Silicon runner
        run: |
          test "$(uname -s)" = 'Darwin'
          test "$(uname -m)" = 'arm64'
          sw_vers
          python --version
          node --version

      - name: Restore generated image assets
        working-directory: source/v047_source
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          encoded = Path('build/vk-search-icon.jpg.b64').read_text(encoding='utf-8').strip()
          raw = base64.b64decode(encoded, validate=True)
          if len(raw) < 10_000 or not raw.startswith(b'\xff\xd8'):
              raise SystemExit('VK Search icon source is invalid')
          for target_name in ('build/vk-search-icon.jpg', 'frontend/public/vk-search-icon.jpg'):
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          print(f'restored icon bytes: {len(raw)}')
          PY
          sips -s format png -z 1024 1024 build/vk-search-icon.jpg --out build/app-icon.png >/dev/null
          test -s frontend/public/vk-search-icon.jpg
          test -s build/app-icon.png

      - name: Install backend dependencies
        working-directory: source/v047_source
        run: |
          rm -rf .ci-venv
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -e './backend[dev,desktop]'
          .ci-venv/bin/python -m pip check

      - name: Verify v0.4.10 release metadata and protected sender core
        working-directory: source/v047_source
        run: |
          .ci-venv/bin/python -m pytest \
            backend/tests/test_v0410_versioning.py \
            backend/tests/test_v0410_sender_guard.py \
            backend/tests/test_v0410_desktop_layout_contract.py \
            -q
          grep -q 'version = "0.4.10"' backend/pyproject.toml
          grep -q 'title="VK Search", version="0.4.10"' backend/app/main.py
          grep -q '"version": "0.4.10"' backend/app/api/routes.py
          grep -q '"version": "0.4.10"' frontend/package.json
          grep -q 'VK_Search_0.4.10_macOS_arm64.dmg' build/BUILD_MACOS.sh

      - name: Run protected product and migration regressions
        working-directory: source/v047_source
        run: |
          .ci-venv/bin/python -m pytest \
            backend/tests/test_v049_behavior.py \
            backend/tests/test_v049_unread_semantics.py \
            backend/tests/test_v049_static_assets.py \
            backend/tests/test_v049_preview_upgrade.py \
            backend/tests/test_v049_archive_sync.py \
            backend/tests/test_v049_routes.py \
            backend/tests/test_v049_migration_upgrade.py \
            backend/tests/test_v049_deleted_preview_runtime.py \
            backend/tests/test_v048_behavior.py \
            backend/tests/test_v047_critical_behavior.py \
            backend/tests/test_v047_product_contract.py \
            -q

      - name: Run broad compatible backend suite
        working-directory: source/v047_source
        run: |
          # Historical tests below pin superseded 0.3.x–0.4.6 metadata/semantics or
          # Windows-only installer contracts. The current v0.4.9 protected behavior
          # is covered explicitly above and the protected sender core is byte-identical.
          .ci-venv/bin/python -m pytest backend/tests -q \
            --ignore=backend/tests/test_v049_versioning.py \
            --ignore=backend/tests/test_v049_hosted_workflow.py \
            --ignore=backend/tests/test_v049_self_hosted_workflow.py \
            --ignore=backend/tests/test_macos_portability_045.py \
            --ignore=backend/tests/test_migration_v035_to_v040.py \
            --ignore=backend/tests/test_persistent_queue_041.py \
            --ignore=backend/tests/test_processor.py \
            --ignore=backend/tests/test_services_use_token_refresh_035.py \
            --ignore=backend/tests/test_v046_contract.py \
            --ignore=backend/tests/test_windows_build_scripts.py \
            --ignore=backend/tests/test_windows_portability_044.py \
            --ignore=backend/tests/test_worker_quota_integration_041.py
          .ci-venv/bin/python -m compileall -q backend/app desktop

      - name: Install frontend dependencies
        working-directory: source/v047_source/frontend
        run: npm ci

      - name: Run v0.4.10 scale interaction regressions
        working-directory: source/v047_source/frontend
        run: |
          npm test -- \
            src/utils/uiScale.test.ts \
            src/components/Shell.v0410.test.tsx \
            src/components/ScaledOverlay.test.tsx \
            src/components/MessageBubble.v0410.test.tsx \
            src/hooks/useAutoGrowTextarea.test.ts \
            src/pages/InboxPage.v0410.test.tsx \
            src/pages/AccountsPage.v0410.test.tsx \
            src/styles/v0410.test.ts

      - name: Run broad frontend suite, typecheck and production build
        working-directory: source/v047_source/frontend
        run: |
          npm test -- \
            --exclude src/components/Shell.v049.test.tsx \
            --exclude src/pages/AccountsPage.test.tsx \
            --exclude src/pages/AccountsPage.v049.test.tsx \
            --exclude src/pages/InboxPage.v046.test.tsx \
            --exclude src/pages/InboxPage.v049.test.tsx \
            --exclude src/components/RunSelector.test.tsx \
            --exclude src/pages/ResultsPage.test.tsx \
            --exclude src/styles/v049.test.ts
          npm run typecheck
          npm run build

      - name: Verify production frontend output
        working-directory: source/v047_source/frontend
        run: |
          ! grep -q '/src/main.tsx' dist/index.html
          ! grep -R -E 'fonts\.googleapis\.com|fonts\.gstatic\.com' dist
          grep -E -q '(src|href)="/assets/' dist/index.html
          grep -q '<title>VK Search</title>' dist/index.html
          test -s dist/vk-search-icon.jpg

      - name: Prepare packaged application icon
        working-directory: source/v047_source
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          source = Path('build/vk-search-icon.jpg.b64')
          target = Path('build/vk-search-icon.jpg')
          raw = base64.b64decode(source.read_text(encoding='utf-8').strip(), validate=True)
          if len(raw) < 10_000 or not raw.startswith(b'\xff\xd8'):
              raise SystemExit('VK Search icon source is invalid')
          target.write_bytes(raw)
          print(f'icon bytes: {len(raw)}')
          PY
          sips -s format png -z 1024 1024 build/vk-search-icon.jpg --out build/app-icon.png >/dev/null
          test "$(sips -g pixelWidth build/app-icon.png | awk '/pixelWidth/{print $2}')" = '1024'
          test "$(sips -g pixelHeight build/app-icon.png | awk '/pixelHeight/{print $2}')" = '1024'

      - name: Build and self-test macOS application
        working-directory: source/v047_source
        env:
          PYTHON_BIN: ${{ github.workspace }}/source/v047_source/.ci-venv/bin/python
        run: bash build/BUILD_MACOS.sh

      - name: Verify macOS ARM64 v0.4.10 release artifacts
        working-directory: source/v047_source
        run: |
          APP='build/dist-macos/VK Search.app'
          BIN="$APP/Contents/MacOS/VK Search"
          DMG='build/release/VK_Search_0.4.10_macOS_arm64.dmg'
          test -d "$APP"
          test -x "$BIN"
          test -f "$DMG"
          test -f "$DMG.sha256"
          file "$BIN" | grep -q 'arm64'
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Contents/Info.plist")" = 'VK Search'
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = 'com.vkoutreach.manager'
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = '0.4.10'
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          (cd build/release && shasum -a 256 -c VK_Search_0.4.10_macOS_arm64.dmg.sha256)
          du -sh "$APP" "$DMG"

      - name: Upload verified DMG backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: VK_Search_0.4.10_macOS_arm64
          path: |
            source/v047_source/build/release/VK_Search_0.4.10_macOS_arm64.dmg
            source/v047_source/build/release/VK_Search_0.4.10_macOS_arm64.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub release v0.4.10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import http.client
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ['GITHUB_TOKEN']
          repository = os.environ['GITHUB_REPOSITORY']
          api = f'https://api.github.com/repos/{repository}'
          tag = 'v0.4.10'
          target = os.environ['GITHUB_SHA']
          notes = (
              'VK Search 0.4.10 for macOS Apple Silicon (ARM64). '
              'The saved 75–300% UI scale now applies to the entire application including '
              'sidebar, top bar and workspace. Scale-aware context menus/popovers, compact '
              'auto-growing messenger input, stable voice controls and an explicit account '
              'drag handle are included. The protected outreach sender/queue/retry/quota core '
              'is byte-identical to the frozen 0.4.9 baseline.'
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vk-search-v0410-github-hosted',
          }

          def api_request(method: str, url: str, payload=None, *, allow_404: bool = False):
              data = None
              request_headers = dict(headers)
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
                  request_headers['Content-Type'] = 'application/json'
              request = urllib.request.Request(url, data=data, headers=request_headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  detail = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'GitHub API {method} {url} failed: {exc.code} {detail}') from exc
              return json.loads(raw.decode('utf-8')) if raw else None

          release = api_request('GET', f'{api}/releases/tags/{urllib.parse.quote(tag)}', allow_404=True)
          if release is None:
              release = api_request('POST', f'{api}/releases', {
                  'tag_name': tag,
                  'target_commitish': target,
                  'name': 'VK Search 0.4.10',
                  'body': notes,
                  'draft': False,
                  'prerelease': False,
              })
          release_id = int(release['id'])
          assets = api_request('GET', f'{api}/releases/{release_id}/assets?per_page=100') or []

          paths = [
              Path('source/v047_source/build/release/VK_Search_0.4.10_macOS_arm64.dmg'),
              Path('source/v047_source/build/release/VK_Search_0.4.10_macOS_arm64.dmg.sha256'),
          ]
          for path in paths:
              if not path.is_file():
                  raise RuntimeError(f'Missing release asset: {path}')
              for asset in assets:
                  if asset.get('name') == path.name:
                      api_request('DELETE', f"{api}/releases/assets/{int(asset['id'])}")

              upload_path = f'/repos/{repository}/releases/{release_id}/assets?name={urllib.parse.quote(path.name)}'
              connection = http.client.HTTPSConnection('uploads.github.com', timeout=600)
              try:
                  connection.putrequest('POST', upload_path)
                  connection.putheader('Authorization', f'Bearer {token}')
                  connection.putheader('Accept', 'application/vnd.github+json')
                  connection.putheader('X-GitHub-Api-Version', '2022-11-28')
                  connection.putheader('User-Agent', 'vk-search-v0410-github-hosted')
                  connection.putheader('Content-Type', 'application/octet-stream')
                  connection.putheader('Content-Length', str(path.stat().st_size))
                  connection.endheaders()
                  with path.open('rb') as source_file:
                      while True:
                          chunk = source_file.read(1024 * 1024)
                          if not chunk:
                              break
                          connection.send(chunk)
                  response = connection.getresponse()
                  detail = response.read().decode('utf-8', errors='replace')
                  if response.status not in (200, 201):
                      raise RuntimeError(f'GitHub asset upload failed for {path.name}: {response.status} {detail}')
              finally:
                  connection.close()
              print(f'uploaded {path.name}')
          PY
